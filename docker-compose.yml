# Disposable sandbox Postgres. Nothing in this stack is a production payment environment.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xmoney
      POSTGRES_PASSWORD: xmoney
      POSTGRES_DB: xmoney
    ports:
      - "5432:5432"
    volumes:
      - xmoney_pg:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmoney -d xmoney"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  xmoney_pg:
