[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xmoney-kenya"
version = "0.1.0"
description = "Sandbox-only pay-by-@handle wallet prototype for Kenya. Never moves real money."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["mpesa", "ledger", "sandbox", "kenya", "fastapi"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "alembic>=1.14",
  "argon2-cffi>=23.1",
  "fastapi>=0.115",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pydantic>=2.10",
  "sqlalchemy>=2.0.36",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.122",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff==0.17.0",  # keep in step with .pre-commit-config.yaml
]

[project.scripts]
xmoney = "xmoney.main:main"
xmoney-resolve-topups = "xmoney.payments.resolve:main"
xmoney-demo = "xmoney.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xmoney = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "alembic"]
extend-exclude = ["alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests", "alembic"]
exclude = ["^alembic/script\\.py\\.mako$"]

# Tests are type-checked, but pytest fixtures and test functions need not be annotated.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
