name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xmoney
          POSTGRES_PASSWORD: xmoney
          POSTGRES_DB: xmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xmoney -d xmoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://xmoney:xmoney@localhost:5432/xmoney_test
      SANDBOX_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests alembic && ruff format --check src tests alembic
      - name: Migrate
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - name: Test
        run: pytest
