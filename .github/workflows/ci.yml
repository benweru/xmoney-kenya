name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xmoney
          POSTGRES_PASSWORD: xmoney
          POSTGRES_DB: xmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xmoney -d xmoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://xmoney:xmoney@localhost:5432/xmoney_test
      SANDBOX_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests alembic && ruff format --check src tests alembic
      - name: Typecheck
        run: mypy
      - name: Check openapi.json is current
        run: python scripts/export_openapi.py --check
      - name: Migrate
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - name: Test
        run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check API types match api/openapi.json
        run: npm run api:types && git diff --exit-code lib/api/schema.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the demo stack
        run: docker compose --profile app up -d --build
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/health && curl -fsS localhost:3000/api/health >/dev/null; then
              echo; echo "stack is up"; exit 0
            fi
            sleep 2
          done
          docker compose --profile app logs
          exit 1
      - name: Stop
        if: always()
        run: docker compose --profile app down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start the demo stack on the Daraja mock
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 60); do
            curl -fsS localhost:3000/api/health >/dev/null && exit 0
            sleep 2
          done
          docker compose --profile app logs
          exit 1
      - name: Playwright
        working-directory: web
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose --profile app logs
      - name: Stop
        if: always()
        run: docker compose --profile app down -v
