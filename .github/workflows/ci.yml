name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: xmoney
          POSTGRES_PASSWORD: xmoney
          POSTGRES_DB: xmoney_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xmoney -d xmoney_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://xmoney:xmoney@localhost:5432/xmoney_test
      SANDBOX_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests alembic && ruff format --check src tests alembic
      - name: Typecheck
        run: mypy
      - name: Check openapi.json is current
        run: python scripts/export_openapi.py --check
      - name: Migrate
        run: alembic upgrade head
      - name: Check models match migrations
        run: alembic check
      - name: Downgrade and re-upgrade
        run: alembic downgrade base && alembic upgrade head
      - name: Test
        run: pytest --cov=xmoney --cov-report=term-missing --cov-fail-under=80

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Check API types match api/openapi.json
        run: npm run api:types && git diff --exit-code lib/api/schema.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the demo stack
        run: |
          # Docker Hub sometimes returns 500 for postgres:16-alpine. Pull it
          # first so one blip does not fail the job, then do not pull again.
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:16-alpine; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "docker pull postgres:16-alpine failed after 5 attempts"
              exit 1
            fi
            echo "docker pull postgres:16-alpine failed (attempt ${attempt}/5); retrying"
            sleep $((attempt * 5))
          done
          docker compose --profile app up -d --build --pull missing
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            if curl -fsS localhost:8000/health && curl -fsS localhost:3000/api/health >/dev/null; then
              echo; echo "stack is up"; exit 0
            fi
            sleep 2
          done
          docker compose --profile app logs
          exit 1
      - name: Chaos subset (worker kill)
        run: python3 infra/chaos/run.py --subset --base-url http://127.0.0.1:8000
      - name: Stop
        if: always()
        run: docker compose --profile app down -v

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      - name: Start the demo stack on the Daraja mock
        run: |
          # Docker Hub sometimes returns 500 for postgres:16-alpine. Pull it
          # first so one blip does not fail the job, then do not pull again.
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:16-alpine; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "docker pull postgres:16-alpine failed after 5 attempts"
              exit 1
            fi
            echo "docker pull postgres:16-alpine failed (attempt ${attempt}/5); retrying"
            sleep $((attempt * 5))
          done
          docker compose --profile app up -d --build --pull missing
          for i in $(seq 1 60); do
            curl -fsS localhost:3000/api/health >/dev/null && exit 0
            sleep 2
          done
          docker compose --profile app logs
          exit 1
      - name: Playwright
        working-directory: web
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Stack logs
        if: failure()
        run: docker compose --profile app logs
      - name: Stop
        if: always()
        run: docker compose --profile app down -v

  # Offline checks only: no AWS credentials, no backend, nothing is planned or applied.
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0
      - uses: actions/cache@v4
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ hashFiles('infra/terraform/.tflint.hcl') }}
      - name: Format
        run: terraform fmt -check -recursive -diff
      - name: Validate
        run: |
          for stack in bootstrap foundation app; do
            echo "::group::$stack"
            terraform -chdir=$stack init -backend=false -input=false -lockfile=readonly
            terraform -chdir=$stack validate
            echo "::endgroup::"
          done
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl" --format compact
      - name: Shellcheck the AWS scripts
        working-directory: infra/scripts
        run: shellcheck ./*.sh

  # M2 evidence: dependency, secret, and image scans. Separate from pytest so a
  # scan finding does not hide a test failure, and so we build images once here
  # instead of adding minutes to the api job.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit (API)
        working-directory: api
        run: |
          pip install -e ".[dev]" pip-audit
          pip-audit --progress-spinner off --desc on
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm audit --omit=dev (web)
        working-directory: web
        run: npm ci && npm audit --omit=dev --audit-level=high
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: gitleaks
        run: gitleaks detect --source . --verbose --redact --exit-code 1
      - name: Build images
        run: docker compose --profile app build
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xmoney-kenya-api:latest
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: xmoney-kenya-web:latest
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
